
x-app: &app
  build:
    context: .
    args:
      UV_SYNC_ARGS: --group dev
      DJANGO_SETTINGS_MODULE: app.settings.development
  image: grupo9-app:dev
  env_file: .env
  environment:
    POSTGRES_HOST: db
  volumes:
    - ./src:/app/src
    - ./pyproject.toml:/app/pyproject.toml:ro

services:

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml:ro
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        uv run --no-sync python src/manage.py migrate --noinput &&
        exec uv run --no-sync uvicorn app.asgi:application \
          --host 0.0.0.0 \
          --port 8000 \
          --reload \
          --reload-dir src \
          --reload-include '*.html' \
          --reload-include '*.js' \
          --reload-include '*.css' \
          --timeout-graceful-shutdown 0

  tailwind-watcher:
    <<: *app
    tty: true
    stdin_open: true
    command:
      - uv
      - run
      - python
      - src/manage.py
      - tailwind
      - watch

volumes:
  media:
  postgres_data:
