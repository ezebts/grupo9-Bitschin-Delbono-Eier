{% load static %}
<link rel="stylesheet" href="{% static 'shared/leaflet/leaflet.css' %}">
<script defer src="{% static 'shared/leaflet/leaflet.js' %}"></script>
<script>
    document.addEventListener('alpine:init', () => {
        L.Icon.Default.imagePath = ''
        L.Icon.Default.mergeOptions({
            iconUrl: '{% static "shared/leaflet/images/marker-icon.png" %}',
            iconRetinaUrl: '{% static "shared/leaflet/images/marker-icon-2x.png" %}',
            shadowUrl: '{% static "shared/leaflet/images/marker-shadow.png" %}',
        })
    })
</script>
