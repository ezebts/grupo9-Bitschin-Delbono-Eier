<!DOCTYPE html>
<html lang="es">
<body style="margin:0;background:#E9EDEA;font-family:Figtree,system-ui,sans-serif;color:#12201B;">
    <div style="max-width:680px;margin:0 auto;padding:28px;">
        <article style="border-radius:16px;background:#FFFFFF;overflow:hidden;">
            <div style="padding:22px 36px;border-bottom:1px solid #DCE2DE;font-weight:700;font-size:20px;">
                Magistral
            </div>
            <div style="padding:32px 36px;">
                <span style="display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:#FCEFD9;color:#8A4B00;">
                    {{ badge }}
                </span>
                <h1 style="margin:20px 0 0;font-size:30px;line-height:1.15;">
                    {{ title }}
                </h1>
                <p style="font-size:16px;line-height:1.55;color:#3F4B47;">
                    {{ message }}
                </p>
                <p style="margin-top:20px;">
                    <a href="{{ action_url }}" style="display:inline-block;padding:16px 26px;border-radius:12px;background:#0E6B55;color:#FFFFFF;font-weight:700;font-size:16px;text-decoration:none;">
                        {{ action_label }}
                    </a>
                </p>
                {% if note %}
                    <p style="font-size:14px;line-height:1.55;color:#51605A;">
                        {{ note }}
                    </p>
                {% endif %}
            </div>
        </article>
    </div>
</body>
</html>
