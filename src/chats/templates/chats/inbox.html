{% extends 'base.html' %}

{% block head_title %}Solicitudes | Magistral{% endblock %}

{% block content %}
    <main class="min-h-screen bg-base-200">
        <div class="max-w-7xl mx-auto px-6 py-5 pb-12 flex flex-col gap-4">
            <h1 class="text-3xl font-bold tracking-tight leading-tight">Solicitudes y chats</h1>
            {% include 'chats/_inbox_content.html' %}
        </div>
    </main>
    <script>
        function pinMessages() {
            const messages = document.querySelector('[data-messages]')
            if (messages) messages.scrollTop = messages.scrollHeight
        }
        function clearDeliveryCost(form) {
            const home = form.querySelector('input[name="delivery_preferences"][value="home_delivery"]')
            const cost = form.querySelector('[name="delivery_cost"]')
            if (!home || !cost || home.checked) return
            cost.value = ''
        }
        document.querySelectorAll('[data-quote-form]').forEach(clearDeliveryCost)
        document.addEventListener('change', (event) => {
            if (event.target.name !== 'delivery_preferences') return
            const form = event.target.closest('[data-quote-form]')
            if (form) clearDeliveryCost(form)
        })
        pinMessages()
        document.body.addEventListener('htmx:afterSwap', () => {
            pinMessages()
            document.querySelectorAll('[data-quote-form]').forEach(clearDeliveryCost)
            document.querySelector('[data-chat-form] textarea')?.focus()
        })
        document.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' || event.shiftKey || event.target.tagName !== 'TEXTAREA') return
            const form = event.target.closest('[data-chat-form]')
            if (!form) return
            event.preventDefault()
            form.requestSubmit()
        })
    </script>
{% endblock %}
