[project]
name = "grupo9-bitschin-delbono-eier"
version = "0.1.0"
requires-python = ">=3.13.15"
dependencies = [
    "django>=6.1.1",
    "django-allauth[socialaccount]>=65.19.7",
    "django-cotton>=2.7.2",
    "django-htmx>=1.29.0",
    "django-tailwind-cli>=4.8.1",
    "django-tasks-db>=0.13.0",
    "django-widget-tweaks>=1.5.1",
    "heroicons[django]>=2.14.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "python-decouple>=3.8",
    "python-magic>=0.4.27",
    "uvicorn[standard]>=0.54.0",
    "whitenoise[brotli]>=6.12.0",
]

[dependency-groups]
dev = [
    "django-browser-reload>=1.21.0",
    "django-debug-toolbar>=7.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app.settings.testing"
pythonpath = ["src"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
cache_dir = "/tmp/pytest_cache"
