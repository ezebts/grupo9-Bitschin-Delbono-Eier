# Render Blueprint. Create it from the dashboard: New > Blueprint,
# and set the Blueprint path to production.yaml.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: magistral
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz/
    dockerCommand: /app/bin/start-web
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: app.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: HOSTNAME
        value: recetasmagistral.com.ar
      - key: DATABASE_URL
        fromDatabase:
          name: magistral-db
          property: connectionString
      - key: DEFAULT_FROM_EMAIL
        value: "Magistral <hola@notificaciones.recetasmagistral.com.ar>"
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DEMO_PHARMACY_PASSWORD
        sync: false

databases:
  - name: magistral-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: magistral
    user: magistral
    ipAllowList: []
