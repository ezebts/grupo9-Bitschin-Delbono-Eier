# Render Blueprint. Create it from the dashboard: New > Blueprint.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: magistral
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz/
    preDeployCommand: /app/bin/prepare-release
    dockerCommand: /app/bin/start-web
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: app.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: HOSTNAME
        fromService:
          type: web
          name: magistral
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: magistral-db
          property: connectionString
      - key: DEFAULT_FROM_EMAIL
        value: Magistral <notificaciones@localhost>
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: magistral-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: magistral
    user: magistral
    ipAllowList: []
